<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Laura 💜 — Level 3</title>

<style>
body {
    background: #0a0014;
    margin: 0;
    padding: 0;
    overflow: hidden;
    cursor: none;
    font-family: 'Trebuchet MS', sans-serif;
}

/* Cursor inimioară */
#cursorHeart {
    position: fixed;
    pointer-events: none;
    font-size: 32px;
    color: #ff66cc;
    z-index: 9999;
}

/* Inimioare care cad */
.heart {
    position: fixed;
    top: -20px;
    font-size: 28px;
    color: #ff66cc;
    animation: fall 5s linear forwards;
}
@keyframes fall {
    0% { opacity: 1; }
    100% { transform: translateY(110vh); opacity: 0; }
}

/* Video container */
#videoBox {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* Video styling */
video {
    width: 85%;
    max-width: 900px;
    border-radius: 20px;
    box-shadow: 0 0 25px #ff003c;
    z-index: 1;
}

/* Text peste video */
#sceneText {
    position: absolute;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    max-width: 800px;
    text-align: center;
    font-size: 22px;
    color: #ff99c8;
    text-shadow: 0 0 10px #ff99c8;
    opacity: 0;
    transition: opacity 2s;
    z-index: 2;
}

/* Buton magic */
#ritualBtn {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    background: transparent;
    border: none;
    font-size: 50px;
    color: #ff66cc;
    text-shadow: 0 0 30px #ff66cc;
    cursor: none;
    opacity: 0;
    transition: 0.3s;
    z-index: 3;
}
#ritualBtn:hover {
    color: #ff99dd;
    text-shadow: 0 0 40px #ff99dd;
}
</style>
</head>
<body>

<!-- CURSOR -->
<div id="cursorHeart">💜</div>

<script>
document.addEventListener("mousemove", e => {
    const c = document.getElementById("cursorHeart");
    c.style.left = e.pageX + "px";
    c.style.top = e.pageY + "px";
});

/* Inimioare */
function createHeart() {
    const h = document.createElement("div");
    h.classList.add("heart");
    h.innerHTML = "💜";
    h.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 5000);
}
for (let i = 0; i < 60; i++) setTimeout(createHeart, i * 120);
</script>

<!-- VIDEO + TEXT -->
<div id="videoBox">
    <video id="sceneVideo" controls>
        <source src="HarleyJoker.mp4" type="video/mp4">
    </video>

    <div id="sceneText">
        A question whispered in chaos…<br><br>
        “Would you give everything for me?”<br>
        A heartbeat later — “Yes.”<br><br>
        “Too easy… would you live for me?”<br>
        The world stops. “Yes.”<br><br>
        Desire becomes surrender.<br>
        Surrender becomes power.<br><br>
        “Do you want this?”<br>
        “I do.”
    </div>

    <button id="ritualBtn" onclick="ritual()">💜</button>
</div>

<script>
const video = document.getElementById("sceneVideo");
const text = document.getElementById("sceneText");
const btn = document.getElementById("ritualBtn");

let textShown = false;
let btnShown = false;

/* Text + buton apar la timp */
video.addEventListener("timeupdate", () => {

    /* Text apare */
    if (video.currentTime >= 1 && !textShown) {
        text.style.opacity = "1";
        textShown = true;
    }

    /* Text dispare */
    if (video.currentTime >= 12 && textShown) {
        text.style.opacity = "0";
    }

    /* Buton apare */
    if (video.currentTime >= 14 && !btnShown) {
        btn.style.opacity = "1";
        btnShown = true;
    }
});

/* Ritual button */
function ritual() {
    btn.innerText = "✨";
    btn.style.fontSize = "60px";
    btn.style.color = "#ff99dd";
    btn.style.textShadow = "0 0 50px #ff99dd";

    setTimeout(() => window.location.href = "page4.html", 900);
}
</script>

</body>
</html>
