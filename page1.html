<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Laura 💜 — Level 1</title>

<style>
body {
    background: #0a0014;
    color: white;
    font-family: 'Trebuchet MS', sans-serif;
    text-align: center;
    overflow: hidden;
    cursor: none;
}

#cursorHeart {
    position: fixed;
    pointer-events: none;
    font-size: 30px;
    color: #ff66cc;
    z-index: 9999;
}

.heart {
    position: fixed;
    top: -20px;
    font-size: 25px;
    color: #ff66cc;
    animation: fall 4s linear forwards;
}
@keyframes fall {
    0% { opacity: 1; }
    100% { transform: translateY(100vh); opacity: 0; }
}

h1 {
    font-size: 48px;
    margin-top: 60px;
    color: #b38bff;
    text-shadow: 0 0 20px #b38bff;
}

.sub {
    font-size: 24px;
    color: #d8c9ff;
    text-shadow: 0 0 10px #d8c9ff;
}

button {
    background: #b38bff;
    border: none;
    padding: 15px 40px;
    font-size: 22px;
    border-radius: 50px;
    cursor: none;
    transition: 0.3s;
    box-shadow: 0 0 20px #b38bff;
}
button:hover {
    background: #d1b3ff;
    box-shadow: 0 0 30px #d1b3ff;
}

#noBtn {
    position: relative;
}

#volumeBox {
    position: fixed;
    bottom: 20px;
    right: 20px;
    color: #ff99c8;
    font-size: 18px;
    text-shadow: 0 0 10px #ff99c8;
}

#volumeSlider {
    width: 120px;
}
</style>
</head>
<body>

<div id="cursorHeart">💜</div>

<script>
document.addEventListener("mousemove", e => {
    const c = document.getElementById("cursorHeart");
    c.style.left = e.pageX + "px";
    c.style.top = e.pageY + "px";
});

function createHeart() {
    const h = document.createElement("div");
    h.classList.add("heart");
    h.innerHTML = "💜";
    h.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 4000);
}
for (let i = 0; i < 40; i++) setTimeout(createHeart, i * 120);
</script>

<audio id="bgMusic" src="HimI.mp3" loop autoplay></audio>

<div id="volumeBox">
    Volume 💜<br>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
</div>

<script>
const music = document.getElementById("bgMusic");
const slider = document.getElementById("volumeSlider");
music.volume = 0.5;
slider.addEventListener("input", () => music.volume = slider.value);
</script>

<h1>Happy Birthday, Laura 💜</h1>
<p class="sub">la mia regina</p>
<p class="sub">Someone wanted to make you smile today.</p>
<p class="sub">From your Stepbrother… your little chaos partner.</p>

<br><br>

<p class="sub" style="font-size: 26px;">Do you still love me?</p>

<button onclick="yes()">YES 💜</button>
<button id="noBtn" onclick="no()">NO</button>

<script>
function yes() {
    window.location.href = "page2.html";
}

function no() {
    let btn = document.getElementById("noBtn");
    btn.style.left = (Math.random() * 200 - 100) + "px";
    btn.style.top = (Math.random() * 200 - 100) + "px";
    btn.style.transform = "scale(0.7)";
    btn.innerText = "YES 💜";
}
</script>

</body>
</html>
