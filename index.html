<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Laura 💜</title>

<style>
body {
    background: #0a0014;
    color: white;
    font-family: 'Trebuchet MS', sans-serif;
    text-align: center;
    padding: 40px;
    overflow-x: hidden;
    cursor: none;
}

/* Custom cursor */
#cursorHeart {
    position: fixed;
    pointer-events: none;
    font-size: 28px;
    color: #ff66cc;
    z-index: 9999;
}

/* Fade-in text */
h1, p {
    animation: fadeIn 1.5s ease;
}
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Buttons */
button {
    background: #b38bff;
    border: none;
    padding: 15px 30px;
    font-size: 20px;
    border-radius: 10px;
    cursor: none;
    transition: 0.3s;
}
button:hover {
    background: #d1b3ff;
}

/* Moving NO button */
#noBtn {
    position: relative;
}

/* Mute button */
#muteBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: transparent;
    border: none;
    font-size: 30px;
    cursor: none;
    color: #b38bff;
}
#muteBtn:hover {
    color: #d1b3ff;
}

/* Falling hearts */
.heart {
    position: fixed;
    top: -20px;
    font-size: 25px;
    color: #ff66cc;
    animation: fall 4s linear forwards;
}
@keyframes fall {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(100vh); opacity: 0; }
}

audio { display: none; }
</style>
</head>
<body>

<!-- CUSTOM CURSOR -->
<div id="cursorHeart">💜</div>

<script>
document.addEventListener("mousemove", function(e) {
    const cursor = document.getElementById("cursorHeart");
    cursor.style.left = e.pageX + "px";
    cursor.style.top = e.pageY + "px";
});
</script>

<!-- AUDIO PLAYER -->
<audio id="bgMusic" src="HimI.mp3" loop></audio>

<!-- MUTE BUTTON -->
<button id="muteBtn">🔊</button>

<script>
let music = document.getElementById("bgMusic");
music.volume = 0.15;
let isMuted = false;

// Start music on first click (browser requirement)
document.addEventListener("click", () => {
    music.play();
}, { once: true });

document.getElementById("muteBtn").onclick = function() {
    if (!isMuted) {
        music.muted = true;
        this.innerText = "🔇";
        isMuted = true;
    } else {
        music.muted = false;
        this.innerText = "🔊";
        isMuted = false;
    }
};

// Falling hearts animation
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💜";
    heart.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
}

for (let i = 0; i < 25; i++) {
    setTimeout(createHeart, i * 150);
}
</script>

<h1>Hey Laura 💜</h1>
<p><i>la mia regina</i></p>
<p>Someone wanted to make you smile today.</p>

<br><br>

<h2 style="color:#b38bff;">Mini Game 🎮</h2>
<p>Be honest…</p>
<h3 style="color:#d8c9ff;">Do you still love me?</h3>

<button onclick="step2()">YES 💜</button>
<button id="noBtn" onclick="moveNo()">NO</button>

<script>
function step2() {
    window.location.href = "page2.html";
}

function moveNo() {
    let btn = document.getElementById("noBtn");
    btn.style.left = (Math.random() * 200 - 100) + "px";
    btn.style.top = (Math.random() * 200 - 100) + "px";
    btn.style.transform = "scale(0.7)";
    btn.innerText = "YES 💜";
}
</script>

</body>
</html>
