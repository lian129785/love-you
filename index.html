<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret Entry 💜</title>

<style>
body {
    background: #0a0014;
    color: white;
    font-family: 'Trebuchet MS', sans-serif;
    text-align: center;
    overflow: hidden;
    cursor: none;
}

#cursorHeart {
    position: fixed;
    pointer-events: none;
    font-size: 30px;
    color: #ff66cc;
    z-index: 9999;
}

.heart {
    position: fixed;
    top: -20px;
    font-size: 25px;
    color: #ff66cc;
    animation: fall 4s linear forwards;
}
@keyframes fall {
    0% { opacity: 1; }
    100% { transform: translateY(100vh); opacity: 0; }
}

h1 {
    font-size: 42px;
    margin-top: 70px;
    color: #b38bff;
    text-shadow: 0 0 20px #b38bff;
}

#hint {
    margin-top: 10px;
    font-size: 20px;
    color: #ff99c8;
    text-shadow: 0 0 10px #ff99c8;
}

input {
    padding: 10px 20px;
    border-radius: 30px;
    border: none;
    font-size: 18px;
    margin-top: 25px;
    text-align: center;
}

button {
    margin-top: 20px;
    background: #b38bff;
    border: none;
    padding: 10px 30px;
    font-size: 20px;
    border-radius: 40px;
    cursor: none;
    box-shadow: 0 0 20px #b38bff;
    transition: 0.3s;
}
button:hover {
    background: #d1b3ff;
    box-shadow: 0 0 30px #d1b3ff;
}

#error {
    margin-top: 15px;
    color: #ff003c;
    text-shadow: 0 0 15px #ff003c;
    font-size: 18px;
}
</style>
</head>
<body>

<div id="cursorHeart">💜</div>

<script>
document.addEventListener("mousemove", e => {
    const c = document.getElementById("cursorHeart");
    c.style.left = e.pageX + "px";
    c.style.top = e.pageY + "px";
});

function createHeart() {
    const h = document.createElement("div");
    h.classList.add("heart");
    h.innerHTML = "💜";
    h.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 4000);
}
for (let i = 0; i < 40; i++) setTimeout(createHeart, i * 120);
</script>

<h1>Secret Birthday Gate 💜</h1>
<p>Only one person can enter this little universe.</p>

<div id="hint">
Hint: How do I call you when you call me “Frumoaso”? 💜
</div>

<input type="password" id="passInput" placeholder="Enter your secret key">
<br>
<button onclick="checkPass()">Enter 💜</button>

<div id="error"></div>

<script>
function checkPass() {
    const val = document.getElementById("passInput").value.trim().toLowerCase();
    const err = document.getElementById("error");
    if (val === "uratule") {
        window.location.href = "page1.html";
    } else {
        err.textContent = "Nope… only Pisoiaș knows this. Try again 💜";
    }
}
</script>

</body>
</html>
